name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-auth-secret-with-at-least-thirty-two-characters
      MFA_ENCRYPTION_KEY: ci-mfa-secret-with-at-least-thirty-two-characters
      CLIENT_PORTAL_SECRET: ci-client-portal-secret-with-at-least-thirty-two
      BLOG_AGENT_TOKEN: ci-blog-agent-token
      CLOUDFLARE_ACCOUNT_ID: ci-account
      CLOUDFLARE_D1_DATABASE_ID: ci-database
      CLOUDFLARE_D1_API_TOKEN: ci-token
      NEXT_PUBLIC_BASE_URL: https://brunanutri.com.br
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migrations
        run: npm run migrate:d1:check

      - name: Lint
        run: npm run lint

      - name: Unit and API tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e -- --project=chromium-desktop
