name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    name: Staging deploy and smoke
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.preview-url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      EXPECTED_D1_DATABASE_NAME: ${{ vars.EXPECTED_D1_DATABASE_NAME }}
      EXPECTED_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard against large database artifacts
        run: npm run ci:artifact-check

      - name: Validate migration files
        run: npm run migrate:d1:check

      - name: Apply staging migrations only
        run: npm run migrate:d1

      - name: Verify staging migration status
        run: npm run migrate:d1:status

      - name: Deploy Vercel preview/staging
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(npx --yes vercel deploy --yes --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "preview-url=$url" >> "$GITHUB_OUTPUT"

      - name: HTTP staging smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.preview-url }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_ADMIN_MFA_CODE: ${{ secrets.SMOKE_ADMIN_MFA_CODE }}
        run: npm run ci:http-smoke

      - name: Read-only staging USDA sanity
        run: npm run ci:d1-usda-sanity

  production:
    name: Production deploy and smoke
    runs-on: ubuntu-latest
    needs: staging
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production-url }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      EXPECTED_D1_DATABASE_NAME: ${{ vars.EXPECTED_D1_DATABASE_NAME }}
      EXPECTED_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      EXPECTED_USDA_FOODS: "2895"
      EXPECTED_USDA_NUTRIENTS: "85971"
      EXPECTED_USDA_FTS: "2895"
      REQUIRE_USDA_BATCH: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard against large database artifacts
        run: npm run ci:artifact-check

      - name: Require production environment approval configuration
        run: |
          if [ "${{ vars.PRODUCTION_DEPLOY_APPROVAL_CONFIGURED }}" != "true" ]; then
            echo "GitHub Environment production must require approval before deploy."
            echo "Set environment variable PRODUCTION_DEPLOY_APPROVAL_CONFIGURED=true only after protection rules are configured."
            exit 1
          fi

      - name: Validate migration files
        run: npm run migrate:d1:check

      - name: Pre-production USDA sanity
        run: npm run ci:d1-usda-sanity

      - name: Apply production migrations
        run: npm run migrate:d1

      - name: Verify production migration status
        run: npm run migrate:d1:status

      - name: Deploy Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "production-url=$url" >> "$GITHUB_OUTPUT"

      - name: HTTP production smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.production-url }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_ADMIN_MFA_CODE: ${{ secrets.SMOKE_ADMIN_MFA_CODE }}
        run: npm run ci:http-smoke

      - name: Post-production USDA sanity
        run: npm run ci:d1-usda-sanity
